name: Deploy

# Press "Run workflow" in the Actions tab to put the chosen branch live.
on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  SITE_URL: https://turboxglobal.com
  API_URL: http://api.turboxglobal.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Build and package the API
        run: |
          pnpm --filter @regalvest/api build
          pnpm --filter @regalvest/api package:cpanel
      - name: Build and package the website
        env:
          API_PROXY_TARGET: ${{ env.API_URL }}
        run: |
          pnpm --filter @regalvest/web build
          pnpm --filter @regalvest/web package:cpanel

      - name: SSH access to cPanel
        env:
          KEY: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USER: ${{ secrets.CPANEL_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The server's fingerprint is pinned here so a deploy never trusts
          # a look-alike server. Update it only if the host's key changes.
          echo '[turboxglobal.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGQ2VVpEIvEsFyvjx2pSd+HxFKEGicbQxo4JUCbgdMvc' > ~/.ssh/known_hosts
          printf 'Host cpanel\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  ConnectTimeout 20\n  ServerAliveInterval 15\n' \
            "$HOST" "$PORT" "$USER" > ~/.ssh/config
          # Shared hosting sometimes drops the first connection from a new
          # address, so try a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if ssh cpanel true; then echo "Connected to cPanel."; exit 0; fi
            echo "Connection attempt $attempt failed; retrying in 15s."
            sleep 15
          done
          echo "::error::Could not reach the cPanel server over SSH. The host may be blocking GitHub's servers; check cPanel > SSH Access or ask the host to allow SSH from GitHub Actions."
          exit 1

      - name: Upload, test-start and swap in
        run: |
          STAGE="deploy-gh-${{ github.run_id }}"
          ssh cpanel "rm -rf ~/$STAGE && mkdir -p ~/$STAGE"
          scp apps/api/dist-cpanel/turboxglobal-api.zip apps/web/dist/cpanel/turboxglobal-web.zip "cpanel:$STAGE/"
          ssh cpanel "bash -s -- \$HOME/$STAGE" < scripts/cpanel/deploy-remote.sh

      - name: Check the live site (rolls back automatically if it fails)
        run: |
          for i in $(seq 1 18); do
            sleep 5
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API_URL/api/v1/health" || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/sign-in" || true)
            echo "api=$api web=$web"
            if [ "$api" = 200 ] && [ "$web" = 200 ]; then echo "Live and healthy."; exit 0; fi
          done
          echo "Live site unhealthy after deploy. Rolling back."
          ssh cpanel "bash -s" < scripts/cpanel/rollback-remote.sh
          exit 1
