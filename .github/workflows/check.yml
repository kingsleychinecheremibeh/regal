name: Check

# Builds and tests every push. Never deploys.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: regalvest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests (with a throwaway PostgreSQL)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/regalvest_test
      - run: pnpm build
        env:
          API_PROXY_TARGET: http://api.turboxglobal.com
