services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: regalvest
      POSTGRES_USER: regalvest
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5433:5432"
    volumes:
      - regalvest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regalvest -d regalvest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  regalvest_postgres:
